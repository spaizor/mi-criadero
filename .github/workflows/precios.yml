# Actualiza data/ofertas.json sin pasar por Claude.
#
# La seccion de Ofertas no elige nada: scripts/precios.py abre cada ficha del
# catalogo, lee el precio y escribe el JSON. Como eso es puro trabajo mecanico
# y el script solo usa la biblioteca estandar, cabe entero aqui y no hace falta
# gastar una rutina en lanzarlo.
#
# Las tiendas marcadas con "navegador": true en productos.json se abren con
# Chromium. Se comprobo el 10-08-2026 que MediaMarkt, PcComponentes y Xtralife
# dan 403 (o pagina sin precio) a urllib y sueltan el precio a un navegador
# desde esta misma IP: lo que filtran es parecer un script, no el datacenter.
#
# La cadencia son DOS VECES AL DIA y ese numero tiene tope por arriba: lo que
# hace que esto funcione es pasar por una visita normal, y un producto
# consultado cada media hora deja de serlo. Dos pasadas siguen pareciendo
# trafico humano con holgura y recogen las dos tandas a las que las tiendas
# mueven precios (manana y mediodia); a partir de ahi se apuesta contra las
# tiendas, y esa apuesta se pierde entera, no de a poco.

name: Precios

on:
  schedule:
    # En horario de verano espanol (UTC+2): 06:10 y 14:10; en invierno, una hora
    # menos. Las dos dejan hueco a las rutinas de noticias, que empujan al mismo
    # repo a las 02:00, 02:30 y 14:30 UTC.
    #
    # El minuto 10 y no el 0 es a proposito: GitHub encola muchisimos crons en
    # las horas en punto y los retrasa, asi que pedir las 04:00 no las acerca.
    - cron: "10 4 * * *"
    - cron: "10 12 * * *"
    # Repescas. GitHub no dispara los cron a su hora NUNCA: medidos los 31 runs
    # programados del 10 al 27-08-2026, la mediana de retraso son 36 min por la
    # manana y 56 por la tarde. Eso da igual, porque un precio que entra a las
    # 6:50 vale lo mismo. Lo que no da igual es que a veces no dispara: el 27 y
    # el 28-08-2026 se saltaron pasadas enteras, y ahi no hay job en rojo ni
    # correo, porque un cron que no dispara no falla.
    #
    # El retraso no es cola de runner (medido: 0,0 min en los 31 runs, siempre),
    # asi que no se arregla con mas maquina. Se arregla pidiendolo mas veces:
    # si la primera no sale, sale la siguiente. Y no publican tres veces al dia
    # porque el paso de abajo comprueba antes si la pasada de este tramo ya esta
    # hecha, y si lo esta el job acaba en segundos sin abrir Chromium.
    - cron: "40 5 * * *"
    - cron: "40 7 * * *"
    - cron: "40 13 * * *"
    - cron: "40 15 * * *"
  # El disparador que no vive en GitHub. Cuando falta la pasada, 'vigilar'
  # escribe data/vigilancia.json y lo publica desde la nube de Anthropic, que
  # es ajena al planificador de cron de aqui: ese push sirve de pistoletazo.
  #
  # Dispara solo con ESE fichero, que es el unico que cambia cuando algo va mal.
  # No puede realimentarse: este workflow publica data/ofertas.json, que no esta
  # en la lista, y ademas GitHub no relanza workflows por un push hecho con el
  # GITHUB_TOKEN del propio runner.
  #
  # El guardia de abajo decide igual que con los cron: si la pasada del tramo ya
  # esta hecha, el job acaba en segundos.
  push:
    branches: [main]
    paths:
      - data/vigilancia.json

  workflow_dispatch:
    inputs:
      probar:
        description: "URL de una ficha a probar (no publica nada)"
        required: false
        default: ""

# Sin esto el GITHUB_TOKEN es de solo lectura y el push falla al final,
# despues de haber consultado todas las tiendas.
permissions:
  contents: write

concurrency:
  group: precios
  cancel-in-progress: false

jobs:
  consultar:
    runs-on: ubuntu-latest

    # El 19-08-2026 el paso de instalar Playwright se quedo colgado y el job
    # estuvo SEIS HORAS ahi, hasta que GitHub lo mato por su limite. Un run
    # cancelado no manda aviso, asi que el turno de la manana se perdio sin
    # que nadie se enterase. La ejecucion entera tarda 3-4 minutos: con 20 el
    # margen es de sobra, y si vuelve a colgarse falla pronto y avisa, que es
    # justo lo que no paso.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # El guardia de las repescas. Es el mismo calculo que usa el vigilante
      # ('frescura' sin --margen), y por eso no pueden desincronizarse: con
      # --margen 0 la pregunta pasa de "hay que avisar de que falta" a "hay que
      # hacerla". Lanzarlo a mano desde Actions siempre trabaja, que es para lo
      # que esta el boton.
      - name: Ver si la pasada de este tramo ya esta hecha
        id: guardia
        run: |
          if [ -n "${{ inputs.probar }}" ]; then
            echo "trabajar=no" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "trabajar=si" >> "$GITHUB_OUTPUT"
            echo "Lanzado a mano: se consulta sin preguntar nada."
          elif python3 scripts/precios.py frescura --margen 0; then
            echo "trabajar=no" >> "$GITHUB_OUTPUT"
            echo "La pasada de este tramo ya esta hecha: no se consulta nada."
          else
            echo "trabajar=si" >> "$GITHUB_OUTPUT"
          fi

      - name: Instalar Playwright
        if: steps.guardia.outputs.trabajar == 'si' || inputs.probar != ''
        run: |
          pip install playwright
          playwright install --with-deps chromium

      # Homologar una tienda desde el PC no basta: lo que responde a una IP
      # domestica puede no responder aqui. Antes de meterla en el catalogo hay
      # que probarla en el sitio donde va a correr de verdad, que es este.
      - name: Probar una ficha suelta
        if: inputs.probar != ''
        run: python3 scripts/precios.py probar "${{ inputs.probar }}" --navegador

      - name: Consultar precios
        if: steps.guardia.outputs.trabajar == 'si'
        run: python3 scripts/precios.py consultar

      - name: Contar precios frescos
        id: salud
        if: steps.guardia.outputs.trabajar == 'si'
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json
          d = json.load(open("data/ofertas.json", encoding="utf-8"))
          precios = [p for prod in d["productos"] for p in prod["precios"]]
          ok = [p for p in precios if p.get("estado") == "ok"]
          print(f"ok={len(ok)}")
          print(f"total={len(precios)}")
          EOF

      - name: Publicar
        # Si no ha entrado ni un precio, lo mas probable es que las tiendas
        # esten bloqueando al runner. Publicar entonces solo serviria para
        # dejar un commit diario que marca todo como viejo sin haber mirado
        # nada: mejor no tocar el JSON y que el fallo se vea.
        if: steps.guardia.outputs.trabajar == 'si' && steps.salud.outputs.ok != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 scripts/noticias.py publicar "Actualizar precios ($(TZ=Europe/Madrid date '+%d-%m-%Y %H:%M'))"

      # Se mira el resultado del paso de contar, no solo su numero: cuando el
      # guardia decide que no hay que trabajar, ese paso se salta y 'ok' queda
      # VACIO. Y en las expresiones de GitHub la comparacion es laxa como en
      # JavaScript, asi que '' == '0' es CIERTO: los tres runs del 28-08-2026
      # que acabaron en rojo con "Ninguna tienda ha respondido:  consultas"
      # (con el hueco donde va el numero, que es la pista) no habian abierto
      # una sola ficha. Un vigilante que grita cuando no pasa nada ensena a no
      # leerlo, que es justo lo contrario de para lo que esta.
      #
      # Si lo que falla es 'consultar', este paso tambien se salta y no hace
      # falta que avise: ese job ya esta en rojo por su cuenta.
      - name: Avisar si no ha entrado ningun precio
        if: steps.salud.outcome == 'success' && steps.salud.outputs.ok == '0'
        run: |
          echo "Ninguna tienda ha respondido: ${{ steps.salud.outputs.total }} consultas, 0 precios."
          echo "Si se repite, las tiendas estan bloqueando la IP del runner y esta via no sirve."
          exit 1
